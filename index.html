<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Mamdouh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }
        /* تدرجات اللون الأحمر في الأعلى والأسفل */
        .gradient-bar-top {
            width: 100%;
            height: 45px;
            background: linear-gradient(to bottom, #8B0000, #000);
        }
        .gradient-bar-bottom {
            width: 100%;
            height: 45px;
            background: linear-gradient(to top, #8B0000, #000);
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-grow: 1;
            justify-content: center;
        }

        /* صورة البروفايل بالإطار الأزرق */
        .profile-img-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #00bfff;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #222;
        }
        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* الاسم */
        .name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
            color: #fff;
            letter-spacing: 1px;
        }

        /* الأزرار */
        .btn-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .custom-btn {
            width: 100%;
            background-color: #000;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 0;
            border: none;
            border-top: 2px solid #ff0000;
            border-bottom: 2px solid #ff0000;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .custom-btn:active {
            background-color: #222;
        }
    </style>
</head>
<body>

    <div class="gradient-bar-top"></div>

    <div class="container">
        <!-- صورة البروفايل (قم بتغيير profile.jpg برابط صورتك أو اسم ملفها) -->
        <div class="profile-img-container">
            <img src="profile.jpg" alt="Ahmed Mamdouh" id="profileImg">
        </div>

        <div class="name">Ahmed Mamdouh</div>

        <div class="btn-list">
            <button class="custom-btn" onclick="handleWhatsApp()">WATS APP</button>
            <button class="custom-btn" onclick="handleFacebook()">FACE BOOK</button>
            <button class="custom-btn" onclick="handleInstagram()">INSTAGRAM</button>
        </div>
    </div>

    <div class="gradient-bar-bottom"></div>

    <script>
        function handleWhatsApp() {
            alert("تم تحويلك بنجاح");
            setTimeout(function() {
                window.location.href = "https://wa.me/201068624506";
            }, 400);
        }

        function handleFacebook() {
            alert("تم تحويلك بنجاح");
            setTimeout(function() {
                window.location.href = "https://www.facebook.com/share/1E9AtbwE5Y/";
            }, 400);
        }

        function handleInstagram() {
            alert("لا يوجد حساب في الوقت الحالي");
        }
    </script>
</body>
</html>
